<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Academy</title>
<meta name="description" content="平日夜・週末の短い時間で、実務に直結するアウトプットを。講師と仲間に支えられながら、自分らしいキャリアを作ろう。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/hero.webp">
<style>
  :root {
    --ts-primary:    #0141D4;
    --ts-deep-navy:  #012270;
    --ts-light-blue: #3E78FE;
    --ts-dark:       #222222;
    --ts-mid:        #676688;
    --ts-white:      #FFFFFF;
    --font: 'Graphik', 'Inter', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    --gutter: clamp(16px, 5vw, 72px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ts-white);
    color: var(--ts-dark);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ───────────────────────────── */
  .site-header {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 2;
    padding: 20px var(--gutter);
  }
  .site-header img { height: 28px; width: auto; display: block; }

  /* ── Hero（ファーストビュー） ───────────── */
  .hero {
    position: relative;
    min-height: min(100svh, 820px);
    display: flex;
    align-items: center;
    overflow: hidden;
    isolation: isolate;
  }
  .hero__bg {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 70% center;
  }
  /* 左の窓側（明るい領域）に白グラデーションを重ね、文字の可読性を確保 */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(90deg,
      rgba(255,255,255,.96) 0%,
      rgba(255,255,255,.90) 34%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,0) 64%);
  }
  .hero__inner {
    width: 100%;
    padding: 112px var(--gutter) 64px;
  }
  .hero__content { max-width: 640px; }

  .hero__title {
    margin: 0;
    font-size: clamp(34px, 4.6vw, 60px);
    font-weight: 700;               /* W6相当：このページでの使用はここと実績数値のみ */
    line-height: 1.25;
    letter-spacing: .02em;
    color: var(--ts-dark);
  }
  .hero__title span { display: inline-block; } /* 読点単位で改行させ、語の途中で折れないように */
  .hero__lead {
    line-break: strict;
    margin: 24px 0 0;
    font-size: clamp(15px, 1.3vw, 17px);
    line-height: 1.9;
    color: var(--ts-dark);
  }

  /* ── CTA ─────────────────────────────── */
  .hero__cta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 36px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1.5px solid var(--ts-primary);
    font: 500 16px/1 var(--font);
    text-decoration: none;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .btn--primary {
    background: var(--ts-primary);
    color: var(--ts-white);
    font-weight: 700;
    padding: 0 26px;
  }
  .btn--primary:hover { background: var(--ts-light-blue); border-color: var(--ts-light-blue); }
  .btn--ghost {
    background: rgba(255,255,255,.85);
    color: var(--ts-primary);
  }
  .btn--ghost:hover { background: var(--ts-primary); color: var(--ts-white); }
  .btn:focus-visible { outline: 3px solid var(--ts-light-blue); outline-offset: 3px; }
  .btn svg { width: 16px; height: 16px; flex: none; }

  /* ── 実績 ─────────────────────────────── */
  .hero__stats {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: start;
    gap: 0;
    margin: 44px 0 0;
    padding: 0;
    list-style: none;
  }
  .stat {
    padding: 0 28px;
    border-left: 1px solid rgba(34,34,34,.15);
  }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat__value {
    display: block;
    color: var(--ts-primary);
    font-size: 32px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
  }
  .stat__value small { font-size: 16px; font-weight: 500; margin-left: 2px; }
  .stat__label {
    display: block;
    margin-top: 4px;
    color: var(--ts-mid);
    font-size: 13px;
    line-height: 1.5;
  }
  .hero__note {
    margin: 16px 0 0;
    color: var(--ts-mid);
    font-size: 11px;
    line-height: 1.6;
  }

  /* ── タブレット以下：画像を上、テキストを下に積む ── */
  @media (max-width: 860px) {
    .site-header { position: static; padding-top: 16px; padding-bottom: 16px; }
    .site-header img { height: 24px; }
    .hero { display: block; min-height: 0; }
    .hero::before { display: none; }
    .hero__bg {
      position: static;
      height: auto;
      aspect-ratio: 16 / 10;
      object-position: 72% center;
    }
    .hero__inner { padding: 32px var(--gutter) 48px; }
    .pc-only { display: none; }
    .hero__cta { flex-direction: column; }
    .btn { width: 100%; }
    .hero__stats { grid-template-columns: repeat(3, 1fr); margin-top: 36px; }
    .stat { padding: 0 12px; }
    .stat__value { font-size: 26px; }
    .stat__value small { font-size: 13px; }
    .stat__label { font-size: 12px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="/" aria-label="The Academy トップへ">
    <img src="assets/academy_logo_blue.png" alt="The Academy" width="895" height="241">
  </a>
</header>

<main>
  <section class="hero" aria-labelledby="hero-title">
    <img class="hero__bg" src="assets/hero.webp" alt="明るい部屋でノートパソコンに向かい、メモを取りながら学ぶ女性" width="1672" height="941" fetchpriority="high">

    <div class="hero__inner">
      <div class="hero__content">
        <h1 class="hero__title" id="hero-title">
          <span>学んで、</span><span>つくって、</span><br><span>次のキャリアへ。</span>
        </h1>

        <p class="hero__lead">
          平日夜・週末の短い時間で、実務に直結するアウトプットを。<br class="pc-only">
          講師と仲間に支えられながら、自分らしいキャリアを作ろう。
        </p>

        <div class="hero__cta">
          <a class="btn btn--primary" href="#consultation">
            無料で相談する
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <a class="btn btn--ghost" href="#courses">コースを探す</a>
          <a class="btn btn--ghost" href="#portfolio">ポートフォリオを作る</a>
        </div>

        <ul class="hero__stats" aria-label="The Academy の実績">
          <li class="stat">
            <span class="stat__value">10<small>+</small></span>
            <span class="stat__label">実践コース</span>
          </li>
          <li class="stat">
            <span class="stat__value">4.2<small>/5</small></span>
            <span class="stat__label">平均満足度<sup>※</sup></span>
          </li>
          <li class="stat">
            <span class="stat__value">週2<small>回〜</small></span>
            <span class="stat__label">続けやすい設計</span>
          </li>
        </ul>
        <p class="hero__note">※受講生アンケート（5段階評価）の平均値</p>
      </div>
    </div>
  </section>
</main>

</body>
</html>
