<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Academy</title>
<meta name="description" content="平日夜・週末の短い時間で、実務に直結するアウトプットを。講師と仲間に支えられながら、自分らしいキャリアを作ろう。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/hero.webp">
<style>
  :root {
    --ts-primary:    #0141D4;
    --ts-deep-navy:  #012270;
    --ts-light-blue: #3E78FE;
    --ts-orange:     #F76B38;
    --ts-dark:       #222222;
    --ts-mid:        #676688;
    --ts-white:      #FFFFFF;
    --font: 'Graphik', 'Inter', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    --gutter: clamp(16px, 5vw, 72px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ts-white);
    color: var(--ts-dark);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  .ico { width: 1em; height: 1em; flex: none; }

  /* ── Header ───────────────────────────── */
  .site-header {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 3;
    padding: 20px var(--gutter);
  }
  .site-header img { height: 28px; width: auto; display: block; }

  /* ── Hero ─────────────────────────────── */
  .hero {
    position: relative;
    min-height: min(100svh, 860px);
    display: flex;
    align-items: center;
    overflow: hidden;
    isolation: isolate;
  }
  .hero__media { position: absolute; inset: 0; z-index: -2; }
  .hero__bg {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: 70% center;
  }
  /* 左の窓側（明るい領域）を白く飛ばして、ラベル群の土台にする */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(90deg,
      rgba(255,255,255,.82) 0%,
      rgba(255,255,255,.62) 38%,
      rgba(255,255,255,0) 60%);
  }
  /* 人物横の小ラベル（参考：イメージキャラクター表記） */
  .hero__media-label {
    position: absolute;
    right: 16px;
    bottom: 16px;
    margin: 0;
    padding: 6px 12px;
    background: rgba(255,255,255,.9);
    color: var(--ts-dark);
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: .12em;
  }

  .hero__inner {
    width: 100%;
    padding: 104px var(--gutter) 56px;
  }
  .hero__content { max-width: 600px; }

  /* 見出し：白ボックスを積む */
  .hero__title {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    font-size: clamp(30px, 3.6vw, 50px);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: .1em;
  }
  .hero__title > span {
    display: block;
    padding: .18em .5em .2em .45em;
    background: var(--ts-white);
    color: var(--ts-dark);
  }
  .hero__title em { font-style: normal; color: var(--ts-primary); }

  /* 実績バッジ */
  .badges {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 28px 0 0;
    padding: 0;
    list-style: none;
  }
  .laurel {
    display: flex;
    align-items: center;
    gap: 2px;
    color: var(--ts-primary);
  }
  .laurel__branch { width: 38px; height: 108px; flex: none; }
  .laurel__branch--r { transform: scaleX(-1); }
  .laurel__body { text-align: center; min-width: 118px; }
  .laurel__label, .circle__label {
    display: block;
    color: var(--ts-dark);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: .06em;
  }
  .badge__num {
    display: block;
    color: var(--ts-primary);
    font-size: 48px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  .badge__num small { font-size: .42em; font-weight: 700; margin-left: 2px; }
  .badge__sub {
    display: block;
    color: var(--ts-dark);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
  }

  .circle {
    position: relative;
    width: 128px;
    height: 128px;
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--ts-white);
    box-shadow: 0 0 0 3px rgba(62,120,254,.28);
    text-align: center;
  }
  .circle__tab {
    position: absolute;
    top: 6px;
    padding: 2px 10px;
    background: var(--ts-light-blue);
    color: var(--ts-white);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.6;
    letter-spacing: .08em;
  }
  .circle .badge__num { font-size: 38px; margin-top: 14px; }
  .stars { display: flex; gap: 1px; color: var(--ts-orange); font-size: 13px; margin-top: 2px; }
  .circle__icon { color: var(--ts-primary); font-size: 16px; margin-top: 16px; }
  .circle--week .badge__num { margin-top: 0; font-size: 34px; }

  /* 特長タグ：濃紺の帯に白文字（折返しても帯が行ごとに付く） */
  .tags { margin: 24px 0 0; display: grid; gap: 8px; justify-items: start; }
  .tag {
    margin: 0;
    font-size: clamp(14px, 1.2vw, 16px);
    font-weight: 700;
    line-height: 2.1;
    letter-spacing: .08em;
  }
  .tag { word-break: keep-all; overflow-wrap: anywhere; }
  .tag span {
    padding: .32em .7em;
    background: var(--ts-deep-navy);
    color: var(--ts-white);
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  /* CTA */
  .cta { margin-top: 36px; }
  .cta__main {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 68px;
    padding: 0 56px;
    border-radius: 6px;
    background: var(--ts-primary);
    color: var(--ts-white);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .12em;
    text-decoration: none;
    box-shadow: 0 4px 0 var(--ts-deep-navy);
    transition: transform .12s, box-shadow .12s, background-color .15s;
  }
  .cta__main:hover { background: var(--ts-light-blue); }
  .cta__main:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ts-deep-navy); }
  .cta__main .ico { position: absolute; right: 22px; font-size: 18px; }
  .cta__pill {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, -55%);
    padding: 3px 16px;
    border: 1.5px solid var(--ts-primary);
    border-radius: 999px;
    background: var(--ts-white);
    color: var(--ts-primary);
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: .1em;
    white-space: nowrap;
  }
  .cta__sub {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .cta__sub a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 50px;
    padding: 0 12px;
    border: 1.5px solid var(--ts-primary);
    border-radius: 6px;
    background: rgba(255,255,255,.92);
    color: var(--ts-primary);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .06em;
    text-decoration: none;
    transition: background-color .15s, color .15s;
  }
  .cta__sub a:hover { background: var(--ts-primary); color: var(--ts-white); }
  .cta__sub .ico { font-size: 18px; }
  .cta a:focus-visible { outline: 3px solid var(--ts-light-blue); outline-offset: 3px; }

  .hero__note {
    margin: 14px 0 0;
    color: var(--ts-mid);
    font-size: 11px;
    line-height: 1.6;
  }

  /* ── タブレット以下 ─────────────────────── */
  @media (max-width: 900px) {
    .site-header { position: static; padding-top: 14px; padding-bottom: 14px; }
    .site-header img { height: 24px; }
    .hero { display: block; min-height: 0; }
    .hero::before { display: none; }
    .hero__media { position: relative; }
    .hero__bg { height: auto; aspect-ratio: 4 / 3; object-position: 74% center; }
    .hero__media-label { right: 12px; top: 12px; bottom: auto; font-size: 10px; }
    /* 見出しの白ボックスを写真の下端に重ねる */
    .hero__inner { position: relative; margin-top: -72px; padding: 0 var(--gutter) 48px; }
    .hero__title { font-size: clamp(24px, 7vw, 34px); gap: 6px; }
    .badges { justify-content: center; gap: 8px; }
    .laurel__branch { width: 26px; height: 80px; }
    .laurel__body { min-width: 96px; }
    .laurel .badge__num { font-size: 38px; }
    .circle { width: 98px; height: 98px; }
    .circle .badge__num { font-size: 30px; }
    .circle--week .badge__num { font-size: 26px; }
    .circle__tab { font-size: 10px; padding: 1px 8px; }
    .laurel__label, .circle__label { font-size: 11px; }
    .cta__main { min-height: 62px; padding: 0 44px; font-size: 17px; }
    .cta__sub a { font-size: 14px; }
  }
  @media (max-width: 440px) {
    .cta__sub { grid-template-columns: 1fr; }
  }
  @media (max-width: 370px) {
    .badges { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-laurel" viewBox="0 0 44 120">
    <path d="M35.5,102.4 25.0,94.8 16.9,84.7 11.7,72.8 10.0,60.0 11.7,47.2 16.9,35.3 25.0,25.2 35.5,17.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <g fill="currentColor">
      <ellipse cx="36.9" cy="102.4" rx="7.5" ry="3" transform="rotate(68 35.5 102.4)"/>
      <ellipse cx="27.0" cy="94.8" rx="7.5" ry="3" transform="rotate(84 25.0 94.8)"/>
      <ellipse cx="19.4" cy="84.7" rx="7.5" ry="3" transform="rotate(99 16.9 84.7)"/>
      <ellipse cx="14.6" cy="72.8" rx="7.5" ry="3" transform="rotate(114 11.7 72.8)"/>
      <ellipse cx="13.0" cy="60.0" rx="7.5" ry="3" transform="rotate(130 10.0 60.0)"/>
      <ellipse cx="14.6" cy="47.2" rx="7.5" ry="3" transform="rotate(146 11.7 47.2)"/>
      <ellipse cx="19.4" cy="35.3" rx="7.5" ry="3" transform="rotate(161 16.9 35.3)"/>
      <ellipse cx="27.0" cy="25.2" rx="7.5" ry="3" transform="rotate(176 25.0 25.2)"/>
      <ellipse cx="36.9" cy="17.6" rx="7.5" ry="3" transform="rotate(192 35.5 17.6)"/>
    </g>
  </symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></g></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="site-header">
  <a href="/" aria-label="The Academy トップへ">
    <img src="assets/academy_logo_blue.png" alt="The Academy" width="895" height="241">
  </a>
</header>

<main>
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__media">
      <img class="hero__bg" src="assets/hero.webp" alt="明るい部屋でノートパソコンに向かい、メモを取りながら学ぶ女性" width="1672" height="941" fetchpriority="high">
      <p class="hero__media-label">画像はイメージです</p>
    </div>

    <div class="hero__inner">
      <div class="hero__content">
        <h1 class="hero__title" id="hero-title">
          <span>学んで、つくって、</span>
          <span><em>次のキャリア</em>へ。</span>
        </h1>

        <ul class="badges" aria-label="The Academy の特長">
          <li class="laurel">
            <svg class="laurel__branch" aria-hidden="true"><use href="#i-laurel"/></svg>
            <div class="laurel__body">
              <span class="laurel__label">実務に直結する</span>
              <span class="badge__num">10<small>+</small></span>
              <span class="badge__sub">実践コース</span>
            </div>
            <svg class="laurel__branch laurel__branch--r" aria-hidden="true"><use href="#i-laurel"/></svg>
          </li>
          <li class="circle">
            <span class="circle__tab">平均満足度</span>
            <span class="badge__num">4.2<small>※</small></span>
            <span class="stars" aria-label="5点満点中4.2">
              <svg class="ico"><use href="#i-star"/></svg><svg class="ico"><use href="#i-star"/></svg><svg class="ico"><use href="#i-star"/></svg><svg class="ico"><use href="#i-star"/></svg><svg class="ico" style="opacity:.3"><use href="#i-star"/></svg>
            </span>
          </li>
          <li class="circle circle--week">
            <svg class="ico circle__icon" aria-hidden="true"><use href="#i-calendar"/></svg>
            <span class="badge__num">週2<small>〜</small></span>
            <span class="circle__label">続けやすい設計</span>
          </li>
        </ul>

        <div class="tags">
          <p class="tag"><span>平日夜・週末の<wbr>短い時間で、<wbr>実務に直結する<wbr>アウトプットを。</span></p>
          <p class="tag"><span>講師と仲間に<wbr>支えられながら、<wbr>自分らしい<wbr>キャリアを作ろう。</span></p>
        </div>

        <div class="cta">
          <a class="cta__main" href="#consultation">
            <span class="cta__pill">まずは気軽に話してみる</span>
            無料で相談する
            <svg class="ico" aria-hidden="true"><use href="#i-chevron"/></svg>
          </a>
          <div class="cta__sub">
            <a href="#courses"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>コースを探す</a>
            <a href="#portfolio"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg>ポートフォリオを作る</a>
          </div>
        </div>

        <p class="hero__note">※受講生アンケート（5段階評価）の平均値</p>
      </div>
    </div>
  </section>
</main>

</body>
</html>
